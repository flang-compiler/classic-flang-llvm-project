name: LLVM Project Tests

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      build_target:
        required: false
      projects:
        required: false
      extra_cmake_args:
        required: false
      os_list:
        required: false
        default: '["ubuntu-24.04", "windows-2019", "macOS-13"]'
      python_version:
        required: false
        type: string
        default: '3.11'
  workflow_call:
    inputs:
      build_target:
        required: false
        type: string
        default: "all"

      projects:
        required: true
        type: string

      extra_cmake_args:
        required: false
        type: string

      os_list:
        required: false
        type: string
        default: '["ubuntu-24.04"]'

      python_version:
        required: false
        type: string
        default: '3.11'

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  # If the group name here is the same as the group name in the workflow that includes
  # this one, then the action will try to wait on itself and get stuck.
  group: llvm-project-${{ github.workflow }}-${{ inputs.projects }}-${{ inputs.python_version }}${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  lit-tests:
    name: Lit Tests
    runs-on: ${{ matrix.os }}
    env:
      install_prefix: /usr/local
    strategy:
      fail-fast: false
      matrix:
        target: [X86]
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-13
        include:
          # Enable Windows on ARM build, when an official
          # self-hosted machine is available.
          # - os: self-hosted
          #   target: AArch64
          #   arch: arm64
          - os: windows-latest
            arch: amd64

    steps:
      # On Windows, starting with win19/20220814.1, cmake choose the 32-bit
      # python3.10.6 libraries instead of the 64-bit libraries when building
      # lldb.  Using this setup-python action to make 3.10 the default
      # python fixes this.
      - name: Setup Python
        if: ${{ matrix.os != 'self-hosted' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python_version }}
      # actions/checkout deletes any existing files in the new git directory,
      # so this needs to either run before ccache-action or it has to use
      # clean: false.
      - name: Setup psutil
        # psutil is not available on Windows on ARM.
        if: startsWith(matrix.os, 'windows')
        run: pip install psutil
      - name: Check tools
        run: python --version
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 250
      - name: Setup ccache
        # ccache is not available for Windows on ARM.
        if: ${{ matrix.os != 'self-hosted' }}
        uses: hendrikmuhs/ccache-action@a1209f81afb8c005c13b4296c32e363431bffea5 # v1.2.17
        with:
          # A full build of llvm, clang, lld, and lldb takes about 250MB
          # of ccache space. There's not much reason to have more than this,
          # because we usually won't need to save cache entries from older
          # builds.  Also, there is an overall 10GB cache limit, and each
          # run creates a new cache entry so we want to ensure that we have
          # enough cache space for all the tests to run at once and still
          # fit under the 10 GB limit.
          # Default to 2G to workaround: https://github.com/hendrikmuhs/ccache-action/issues/174
          max-size: 2G
          key: ${{ matrix.os }}
          variant: sccache
      - name: Test clang Windows
        # Some LLVM tests are failing on Windows On ARM,
        # so this step is skipped on WoA until they are fixed.
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          $pcount = $($(Get-WmiObject -class Win32_ComputerSystem).numberoflogicalprocessors)
          python .\scripts\build_llvm_project.py -d build -t ${{ matrix.target }} --cmake-param=-DLLVM_ENABLE_ASSERTIONS=ON -j $pcount
          cd build
          ninja check-all
        shell: powershell
      - name: Test clang macOS
        if: ${{ matrix.os == 'macOS-13'}}
        env:
          # Workaround for https://github.com/actions/virtual-environments/issues/5900.
          # This should be a no-op for non-mac OSes
          PKG_CONFIG_PATH: /usr/local/Homebrew/Library/Homebrew/os/mac/pkgconfig//12
        run: |
          ./build-llvm-project.sh -t X86 -e "clang" -p /usr/local -s -n $(sysctl -n hw.logicalcpu) -i -x "-DLLVM_ENABLE_ASSERTIONS=ON -DLLVM_DISABLE_ASSEMBLY_FILES=ON" -v
          cd build
          make check-all
      - name: Test clang ubuntu
        if: ${{ matrix.os == 'ubuntu-latest'}}
        run: |
          ./build-llvm-project.sh -t X86 -e "${{ inputs.projects }}" -p /usr/local -s -n $(nproc) -i -x "-DLLVM_ENABLE_ASSERTIONS=ON" -v
          cd build
          make check-all
